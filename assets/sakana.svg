<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 背景底板:哑光碳黑 -->
  <rect width="512" height="512" rx="112" fill="#18181B"/>

  <!-- 严格对称与平滑曲率的流线火箭三角。
       2026-08-24:锌灰 #52525B → 品牌红 #E5484D(红 = 我在工作,
       热键可用;免打扰生效时的灰色态见 assets/cue-dnd.svg);
       并 1.20× 放大(16px 托盘可读性),scale 绕中心叠加在 rotate 之后。 -->
  <g transform="translate(256, 256) rotate(45) scale(1.2) translate(-256, -256)">
    <path d="M 256 120
             C 280 120 330 230 350 320
             C 356 348 340 364 316 354
             C 286 340 270 316 256 316
             C 242 316 226 340 196 354
             C 172 364 156 348 162 320
             C 182 230 232 120 256 120
             Z"
          fill="#E5484D"/>
  </g>
</svg>
