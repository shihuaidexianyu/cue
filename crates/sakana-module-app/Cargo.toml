[package]
name = "sakana-module-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
sakana-protocol.workspace = true
sakana-util-win.workspace = true
futures.workspace = true
pinyin.workspace = true
# packaged logo 解码(PNG/BMP/JPEG 嗅探);不进 util-win:
# 只有本模块用(Rule of Three 之前的合理重复边界)。
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Management_Deployment",
    "ApplicationModel",
    "ApplicationModel_Core",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
]
