[package]
name = "sakana-util-win"
version = "0.1.0"
edition.workspace = true

[dependencies]
sakana-protocol.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies.windows]
workspace = true
features = ["Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security"]

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
]
