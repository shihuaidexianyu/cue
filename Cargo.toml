[workspace]
resolver = "2"
members = [
    "crates/sakana",
    "crates/sakana-core",
    "crates/sakana-module-app",
    "crates/sakana-module-bookmark",
    "crates/sakana-module-file",
    "crates/sakana-module-system",
    "crates/sakana-module-web",
    "crates/sakana-protocol",
    "crates/sakana-ui",
    "crates/sakana-util-common",
    "crates/sakana-util-win",
    "crates/sakana-windows",
]

[workspace.package]
edition = "2024"
# 版本单点递进：发布时只改这一行（binary 与 lib 同步走）。
version = "0.7.3"

# crate 统一 sakana- 前缀。`sakana` 为 binary(composition root)。
[workspace.dependencies]
sakana-protocol = { path = "crates/sakana-protocol" }
sakana-core = { path = "crates/sakana-core" }
sakana-ui = { path = "crates/sakana-ui" }
sakana-windows = { path = "crates/sakana-windows" }
sakana-module-app = { path = "crates/sakana-module-app" }
sakana-module-bookmark = { path = "crates/sakana-module-bookmark" }
sakana-module-file = { path = "crates/sakana-module-file" }
sakana-module-system = { path = "crates/sakana-module-system" }
sakana-module-web = { path = "crates/sakana-module-web" }
sakana-util-common = { path = "crates/sakana-util-common" }
sakana-util-win = { path = "crates/sakana-util-win" }

futures = "0.3"
gpui = { version = "0.2", default-features = false, features = ["windows-manifest"] }
toml = "1"
windows = "0.62"
windows-future = "0.3"
pinyin = "0.10"
serde_json = "1"

# 日常开发只保留文件/行号信息，减少 PDB 生成、链接时间和 target 占用。
[profile.dev]
debug = "line-tables-only"

# 第三方依赖通常不需要调试符号；工作区 crate 仍保留行号回溯。
[profile.dev.package."*"]
debug = false

# 需要变量级调试时使用：cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = "full"

# 发行构建:调试符号不进 exe(分发从来不带 PDB);thin LTO + 单
# 代码生成单元,换链接时间要小二进制与更少的跨 crate 边界——
# 加载、Defender 扫描、启动路径都受益。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
